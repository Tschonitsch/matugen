#---------- Base ----------
set-environment -g bg "{{colors.background.default.hex}}"
set-environment -g fg "{{colors.on_background.default.hex}}"
#---------- Base ----------

#---------- Primary ---------- 
set-environment -g primary "{{colors.primary.default.hex}}"
set-environment -g on_primary "{{colors.on_primary.default.hex}}"
set-environment -g primary_container "{{colors.primary_container.default.hex}}"
set-environment -g on_primary_container "{{colors.on_primary_container.default.hex}}"
set-environment -g inverse_primary "{{colors.inverse_primary.default.hex}}"
#---------- Primary ---------- 

#---------- Secondary ----------
set-environment -g secondary "{{colors.secondary.default.hex}}"
set-environment -g on_secondary "{{colors.on_secondary.default.hex}}"
set-environment -g secondary_container "{{colors.secondary_container.default.hex}}"
set-environment -g on_secondary_container "{{colors.on_secondary_container.default.hex}}"
#---------- Secondary ----------

#---------- Tertiary ----------
set-environment -g tertiary "{{colors.tertiary.default.hex}}"
set-environment -g on_tertiary "{{colors.on_tertiary.default.hex}}"
set-environment -g tertiary_container "{{colors.tertiary_container.default.hex}}"
set-environment -g on_tertiary_container "{{colors.on_tertiary_container.default.hex}}"
#---------- Tertiary ----------

#---------- Surface ----------
set-environment -g surface "{{colors.surface.default.hex}}"
set-environment -g on_surface "{{colors.on_surface.default.hex}}"
set-environment -g surface_variant "{{colors.surface_variant.default.hex}}"
set-environment -g on_surface_variant "{{colors.on_surface_variant.default.hex}}"
set-environment -g inverse_surface "{{colors.inverse_surface.default.hex}}"
set-environment -g inverse_on_surface "{{colors.inverse_on_surface.default.hex}}"
#---------- Surface ----------

#---------- Error ----------
set-environment -g error "{{colors.error.default.hex}}"
set-environment -g on_error "{{colors.on_error.default.hex}}"
set-environment -g error_container "{{colors.error_container.default.hex}}"
set-environment -g on_error_container "{{colors.on_error_container.default.hex}}"
#---------- Error ----------

#---------- Outline ----------
set-environment -g outline "{{colors.outline.default.hex}}"
set-environment -g outline_variant "{{colors.outline_variant.default.hex}}"
#---------- Outline ----------
