[config]
reload_apps = true
default_type = "dark"

[cache]
enabled = true

[templates.openrgb]
input_path = "~/.config/matugen/templates/openrgb.txt"
output_path = "~/.config/OpenRGB/matugen.txt"

[templates.tmux]
input_path = "~/.config/matugen/templates/tmux.conf"
output_path = "~/.config/tmux/colors.conf"

[templates.quickshell]
input_path = "~/.config/matugen/templates/colors.qml"
output_path = "~/.config/quickshell/Colors.qml"

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty.conf'
output_path = '~/.config/kitty/colors.conf'

[templates.waybar]
input_path =  '~/.config/matugen/templates/waybar.conf'
output_path = '~/.config/waybar/colors.conf'

[templates.superfile]
input_path = '~/.config/matugen/templates/superfile.toml'
output_path = '~/.config/superfile/theme/matugen.toml'
post_hook = 'pkill -SIGUSR1 superfile || true'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland.lua'
output_path = '~/.config/hypr/colors.lua'

[templates.steam]
input_path = '~/.config/matugen/templates/steam.css'
output_path = '~/.local/share/Steam/millennium/themes/Steam/src/css/root.css'

[templates.neovim]
input_path = '~/.config/matugen/templates/neovim.lua'
output_path = '~/.config/nvim/colors.lua'
post_hook = 'pkill -SIGUSR1 nvim || true'

[templates.obsidian]
input_path = '~/.config/matugen/templates/obsidian.css'
output_path = '~/Documents/Obsidian/.obsidian/themes/Matugen/theme.css'
